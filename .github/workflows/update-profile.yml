name: Update Profile SVGs & Telemetry

on:
  schedule:
    # Runs automatically every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime
  push:
    branches:
      - main
    paths:
      - 'config.yml' # Runs automatically whenever config is modified

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the updated SVGs back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install PyYAML

      - name: Generate Fresh Activity & Bento SVGs
        run: |
          python scripts/generate_contributions_svg.py
          python scripts/generate_bento_svg.py
          python scripts/render_readme.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/bento.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): auto-update profile metrics [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
